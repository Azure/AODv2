trigger: none
pr: none

parameters:
  - name: operation
    displayName: PMC operation
    type: string
    default: publish
    values:
      - publish
      - rollback

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
  pipelines:
    - pipeline: aodv2Build
      source: aodv2-build
      project: One
      trigger: none

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    customBuildTags:
      - 1ES.PT.ViaStartRight
    stages:
      - stage: Preflight
        displayName: Validate selected build in PMC
        templateContext:
          cloud: Public
          isProduction: true
          approval:
            workflow: approvalService
        jobs:
          - job: Preflight
            templateContext:
              type: releaseJob
              workflow: ev2-ra
              inputs:
                - input: pipelineArtifact
                  pipeline: aodv2Build
                  artifactName: drop_PublishEv2Artifacts_AODv2EV2
              ev2:
                serviceRootPath: ServiceGroupRoot
                rolloutSpecPath: RolloutSpec.Test.json
                select: regions(eastus)
                skipRegistrationIfExists: true
                forceRegistration: true
                validateOnly: true

      - ${{ if eq(parameters.operation, 'publish') }}:
        - stage: ProdDeploy
          displayName: Publish selected build to PMC
          dependsOn: Preflight
          condition: succeeded('Preflight')
          templateContext:
            cloud: Public
            isProduction: true
            approval:
              workflow: approvalService
          jobs:
            - job: ReleaseJob
              templateContext:
                type: releaseJob
                workflow: ev2-ra
                inputs:
                  - input: pipelineArtifact
                    pipeline: aodv2Build
                    artifactName: drop_PublishEv2Artifacts_AODv2EV2
                ev2:
                  serviceRootPath: ServiceGroupRoot
                  rolloutSpecPath: RolloutSpec.Prod.json
                  select: regions(eastus)
                  skipRegistrationIfExists: true
                  forceRegistration: true

      - ${{ if eq(parameters.operation, 'rollback') }}:
        - stage: ProdRollback
          displayName: Remove selected build from PMC repositories
          dependsOn: Preflight
          condition: succeeded('Preflight')
          templateContext:
            cloud: Public
            isProduction: true
            approval:
              workflow: approvalService
          jobs:
            - job: RollbackJob
              templateContext:
                type: releaseJob
                workflow: ev2-ra
                inputs:
                  - input: pipelineArtifact
                    pipeline: aodv2Build
                    artifactName: drop_PublishEv2Artifacts_AODv2EV2
                ev2:
                  serviceRootPath: ServiceGroupRoot
                  rolloutSpecPath: RollbackSpec.Prod.json
                  select: regions(eastus)
                  skipRegistrationIfExists: true
                  forceRegistration: true